name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@048587658a53a6300b1262cf9b24545cbfc8940b  # v1.14.1

  matrix-build:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: joeckr/ci-templates/.github/workflows/build-oci-custom.yml@048587658a53a6300b1262cf9b24545cbfc8940b  # v1.14.1
    with:
      image: "oci-custom"

  helm:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@048587658a53a6300b1262cf9b24545cbfc8940b  # v1.14.1
    with:
      charts-dir: 'chart'
