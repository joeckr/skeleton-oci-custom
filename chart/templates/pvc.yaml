apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.name }}
  labels:
    app: {{ .Values.app.name }}
spec:
  accessModes:
    - {{ .Values.pvc.storageAccessMode }}
  resources:
    requests:
      storage: {{ .Values.pvc.storageSize }}
  {{- if .Values.pvc.storageClass }}
  storageClassName: {{ .Values.pvc.storageClass | quote }}
  {{- end }}
